<div id="app"></div><script src="/op-project-staging/assets/site-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const m=document.querySelector('main');if(!m)return;m.outerHTML=`<main class="dry"><h1>Технологии сушки</h1><section class="dry-hero"><div class="dry-overlay"><small>Подбор технологии и выбор оптимального режима</small><h2>Сушка различных материалов</h2><p>Опилки - щепа - пиломатериалы - шпон - песок - уголь - трава - яичный меланж - любые другие продукты, которые требуют сушки</p></div></section><section class="dry-text"><strong>Мы обладаем глубокой экспертизой в области сушки</strong> и обширным опытом внедрения технологий удаления влаги из самых разных материалов и продуктов.\nОбезвоживание и сушка - одна из важнейших групп технологических операций, используемых людьми. Существует множество способов удаления влаги. Выбор оптимальной технологии зависит от многих факторов - таких как:\n- исходная и конечная влажность материала,\n- агрегатное состояние,\n- фракционный состав материала (размер частиц),\n- теплоемкость материала,\n- необходимость сохранения определенных свойств материала,\n- допустимая температура сушки,\n- требуемая производительность сушилки,\nи т.д.\n\nМы умеем сушить...\n\nСыпучие продукты: опилки, щепу, песок, уголь, торф, древесноугольные брикеты, траву, жом....\n\nШтучные изделия: пиломатериалы, шпон...\n\nЖидкие продукты: яичный меланж, молоко, смолы...</section><section class="dry-grid"><article class="dry-card c1"><div><h3>Барабанные сушилки</h3><p>Применяются для сушки сыпучих материалов, допускающих высокую температуру процесса.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c2"><div><h3>Ленточные сушилки</h3><p>Для бережной низкотемпературной сушки сыпучих и штучных материалов.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c3"><div><h3>Агрегат сушки-измельчения АС-4</h3><p>Для одновременной сушки и измельчения сыпучих материалов.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c4"><div><h3>Сушилки жидких продуктов</h3><p>Решения для яичного меланжа, молока, смол и других жидких продуктов.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c5"><div><h3>Сушка пиломатериалов</h3><p>Камерные и другие технологические решения.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c6"><div><h3>Сушка шпона</h3><p>Подбор режима, повышение производительности и утилизация тепла.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article></section><section class="dry-grid egrid"><article class="dry-card e1"><div><h3>Теплогенераторы</h3><p>Для подготовки теплоносителя требуемых параметров.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card e2"><div><h3>Котельные</h3><p>Для подготовки горячей воды, пара или термомасла.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article></section></main>`})</script><script src="/op-project-staging/assets/contact-form.js" defer></script></body></html>
