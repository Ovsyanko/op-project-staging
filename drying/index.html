<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Технологии сушки — ОП Проект</title><link rel="stylesheet" href="/op-project-staging/assets/site-shell.css"><style>.dry{padding:18px 0 60px}.dry h1{text-align:center;font-size:40px;font-weight:500;margin:0 0 34px}.dry-hero{height:470px;background:url('/op-project-staging/assets/images/077745c26e03.jpg') center/cover no-repeat;position:relative;margin-bottom:42px}.dry-hero:after{content:'';position:absolute;inset:48% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55))}.dry-overlay{position:absolute;z-index:2;left:50%;bottom:28px;transform:translateX(-50%);width:min(760px,86%);color:#fff}.dry-overlay small{font-size:14px}.dry-overlay h2{font-size:26px;margin:5px 0 8px}.dry-overlay p{margin:0;font-size:15px}.dry-text{max-width:760px;margin:0 auto 55px;padding:0 24px;font-size:17px;line-height:1.5;white-space:pre-line}.dry-grid{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 24px 40px}.dry-card{height:345px;border-radius:18px;overflow:hidden;background-size:cover;background-position:center;position:relative;color:#fff}.dry-card:after{content:'';position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.76))}.dry-card div{position:absolute;z-index:2;left:20px;right:20px;bottom:20px}.dry-card h3{font-size:22px;line-height:1.05;margin:0 0 8px}.dry-card p{font-size:13px;line-height:1.35;margin:0 0 14px}.dry-card a{display:block;text-align:center;padding:10px;border-radius:8px;background:rgba(255,255,255,.16)}.egrid{max-width:520px;margin:0 auto;grid-template-columns:1fr 1fr}.c1{background-image:url('/op-project-staging/assets/images/077745c26e03.jpg')}.c2{background-image:url('/op-project-staging/assets/images/5b8bc66102e5.webp')}.c3{background-image:url('/op-project-staging/assets/images/d4e52d01da9b.webp')}.c4{background-image:url('/op-project-staging/assets/images/68a8f954cd73.webp')}.c5{background-image:url('/op-project-staging/assets/images/4a2de4a3e15c.webp')}.c6{background-image:url('/op-project-staging/assets/images/d2dec51c39be.webp')}.e1{background-image:url('/op-project-staging/assets/images/3ead5d54128f.webp')}.e2{background-image:url('/op-project-staging/assets/images/7e81e5d793a5.png')}@media(max-width:760px){.dry-grid{grid-template-columns:1fr 1fr}.egrid{grid-template-columns:1fr 1fr}.dry-hero{height:390px}}@media(max-width:520px){.dry-grid,.egrid{grid-template-columns:1fr}.dry-card{height:320px}.dry h1{font-size:34px}}</style></head><body><div id="app"></div><script src="/op-project-staging/assets/site-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const m=document.querySelector('main');if(!m)return;m.outerHTML=`<main class="dry"><h1>Технологии сушки</h1><section class="dry-hero"><div class="dry-overlay"><small>Подбор технологии и выбор оптимального режима</small><h2>Сушка различных материалов</h2><p>Опилки - щепа - пиломатериалы - шпон - песок - уголь - трава - яичный меланж - любые другие продукты, которые требуют сушки</p></div></section><section class="dry-text"><strong>Мы обладаем глубокой экспертизой в области сушки</strong> и обширным опытом внедрения технологий удаления влаги из самых разных материалов и продуктов.\nОбезвоживание и сушка - одна из важнейших групп технологических операций, используемых людьми. Существует множество способов удаления влаги. Выбор оптимальной технологии зависит от многих факторов - таких как:\n- исходная и конечная влажность материала,\n- агрегатное состояние,\n- фракционный состав материала (размер частиц),\n- теплоемкость материала,\n- необходимость сохранения определенных свойств материала,\n- допустимая температура сушки,\n- требуемая производительность сушилки,\nи т.д.\n\nМы умеем сушить...\n\nСыпучие продукты: опилки, щепу, песок, уголь, торф, древесноугольные брикеты, траву, жом....\n\nШтучные изделия: пиломатериалы, шпон...\n\nЖидкие продукты: яичный меланж, молоко, смолы...</section><section class="dry-grid"><article class="dry-card c1"><div><h3>Барабанные сушилки</h3><p>Применяются для сушки сыпучих материалов, допускающих высокую температуру процесса.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c2"><div><h3>Ленточные сушилки</h3><p>Для бережной низкотемпературной сушки сыпучих и штучных материалов.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c3"><div><h3>Агрегат сушки-измельчения АС-4</h3><p>Для одновременной сушки и измельчения сыпучих материалов.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c4"><div><h3>Сушилки жидких продуктов</h3><p>Решения для яичного меланжа, молока, смол и других жидких продуктов.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c5"><div><h3>Сушка пиломатериалов</h3><p>Камерные и другие технологические решения.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card c6"><div><h3>Сушка шпона</h3><p>Подбор режима, повышение производительности и утилизация тепла.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article></section><section class="dry-grid egrid"><article class="dry-card e1"><div><h3>Теплогенераторы</h3><p>Для подготовки теплоносителя требуемых параметров.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article><article class="dry-card e2"><div><h3>Котельные</h3><p>Для подготовки горячей воды, пара или термомасла.</p><a href="/op-project-staging/contacts/">Запросить</a></div></article></section></main>`})</script></body></html>
