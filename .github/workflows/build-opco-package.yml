name: Build op-co.ru FTP package
# package revision 5

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-opco-package.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reg-ru-production

      - name: Prepare root-ready production tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools' \
            --exclude='assets/originals' \
            ./ dist/

          python3 - <<'PY'
          from pathlib import Path
          root=Path('dist')
          text_exts={'.html','.css','.js','.php','.md','.txt','.csv','.tsv','.xml','.json','.map'}
          n=0
          form_injected=0
          metrika_injected=0
          metrika_head=(
              '<!-- Yandex.Metrika counter -->\n'
              '<script type="text/javascript">\n'
              '    (function(m,e,t,r,i,k,a){\n'
              '        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};\n'
              '        m[i].l=1*new Date();\n'
              '        for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}\n'
              '        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)\n'
              "    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=108782713', 'ym');\n\n"
              '    ym(108782713, \'init\', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});\n'
              '</script>\n'
              '<!-- /Yandex.Metrika counter -->'
          )
          metrika_body=(
              '<!-- Yandex.Metrika counter noscript -->\n'
              '<noscript><div><img src="https://mc.yandex.ru/watch/108782713" style="position:absolute; left:-9999px;" alt="" /></div></noscript>\n'
              '<!-- /Yandex.Metrika counter noscript -->'
          )

          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              if p.name=='.htaccess' or p.suffix.lower() in text_exts:
                  try:
                      s=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  ns=s.replace('/op-project-staging','')

                  if p.suffix.lower()=='.html':
                      if '/assets/contact-form.js' not in ns:
                          tag='<script src="/assets/contact-form.js" defer></script>'
                          if '</body>' in ns:
                              ns=ns.replace('</body>',tag+'</body>',1)
                          else:
                              ns+=tag
                          form_injected+=1

                      if 'mc.yandex.ru/metrika/tag.js?id=108782713' not in ns:
                          low=ns.lower()
                          head_pos=low.find('<head')
                          if head_pos!=-1:
                              head_end=ns.find('>',head_pos)
                              if head_end!=-1:
                                  ns=ns[:head_end+1]+'\n'+metrika_head+'\n'+ns[head_end+1:]
                              else:
                                  ns=metrika_head+'\n'+ns
                          else:
                              ns=metrika_head+'\n'+ns

                          low=ns.lower()
                          body_pos=low.find('<body')
                          if body_pos!=-1:
                              body_end=ns.find('>',body_pos)
                              if body_end!=-1:
                                  ns=ns[:body_end+1]+'\n'+metrika_body+'\n'+ns[body_end+1:]
                              else:
                                  ns+='\n'+metrika_body
                          else:
                              ns+='\n'+metrika_body
                          metrika_injected+=1

                  if ns!=s:
                      p.write_text(ns,encoding='utf-8')
                      n+=1

          print('updated',n,'text files; injected contact client into',form_injected,'HTML files; injected Yandex Metrika into',metrika_injected,'HTML files')
          PY

          cat > dist/.htaccess <<'EOF'
          DirectoryIndex index.html
          <IfModule mod_headers.c>
            Header set X-Robots-Tag "noindex, nofollow, noarchive"
          </IfModule>
          EOF

          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/.htaccess.txt dist/.htaccess,txt

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl '/op-project-staging' dist --exclude='*.woff2' --exclude='*.webp' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.png' --exclude='*.gif' | grep .; then exit 1; fi
          test -f dist/index.html
          test -f dist/assets/site-shell.js
          test -f dist/assets/contact-form.js
          test -f dist/api/contact.php
          test -f dist/api/contact-config.example.php
          test -f dist/pellets/index.html
          test -f dist/agro/index.html
          test -f dist/contacts/index.html
          test ! -d dist/assets/originals
          grep -q '/assets/contact-form.js' dist/pellets/index.html
          grep -q '/assets/contact-form.js' dist/contacts/index.html
          grep -q 'mc.yandex.ru/metrika/tag.js?id=108782713' dist/index.html
          grep -q 'mc.yandex.ru/watch/108782713' dist/index.html
          grep -q 'mc.yandex.ru/metrika/tag.js?id=108782713' dist/pellets/index.html
          grep -q 'mc.yandex.ru/metrika/tag.js?id=108782713' dist/contacts/index.html

      - name: Zip
        run: cd dist && zip -qr ../op-co.ru-production-with-forms-metrika.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: op-co.ru-production-with-forms-metrika
          path: op-co.ru-production-with-forms-metrika.zip
          if-no-files-found: error
