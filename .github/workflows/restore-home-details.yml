name: Restore home details exactly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-home-details.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact original assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://s3.reg.solutions/6dae29aa-f330-44ff-8818-1ab5a026f618/images'
          curl -fL --retry 3 "$base/1c502933-1f49-4e6f-a3ab-a7f212df36f6-shutterstock_63581653.jpg" -o assets/images/home-request.jpg
          curl -fL --retry 3 "$base/ff19e279-fbbd-441d-964a-644265ac93ec-sapech.jpg" -o assets/images/home-avatar-anton.jpg
          curl -fL --retry 3 "$base/77cb2962-afcb-4b97-9159-7835db4e6fa8-file.jpg" -o assets/images/home-avatar-sergey.jpg
          curl -fL --retry 3 "$base/e4239533-5031-4f23-ba09-c039884f1cf8-323b8aa8-7430-476a-b7ab-c941173b927b--.png" -o assets/images/home-intro-brand.png

          cat <<'EOF' | sha256sum -c -
          73592c26ebc05a0402c00652b30010b6275dd3b1bbfb3b32294aab9156ccff0d  assets/images/home-request.jpg
          f1f2870f967dbc7367abba4a720a15fbb126dccd54acc08173e7c69c16dedfad  assets/images/home-avatar-anton.jpg
          69ce3b22fc393a3dcc7e080cf21e2d84b0cd0f31dae3c7932a1197b07b5cfc1c  assets/images/home-avatar-sergey.jpg
          e8197a8835502f820d4e9ebcd4d2fd80f4a913ab7b288b958989604321180343  assets/images/home-intro-brand.png
          EOF

      - name: Restore original links and home imagery
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Header: preserve original call-back route.
          s=s.replace('class="ghost" href="/op-project-staging/contacts/">Заказать звонок',
                      'class="ghost" href="/op-project-staging/callmeback/">Заказать звонок')

          # Industry cards that were request-only on the original site.
          s=s.replace('href="/op-project-staging/energy/" style=', 'href="/op-project-staging/contacts/" style=', 1)
          s=s.replace('href="/op-project-staging/food/" style=', 'href="/op-project-staging/contacts/" style=', 1)

          # Technology icon block was informational on the original page, not a set of links.
          a=s.index('<div class="techgrid">')
          b=s.index('</div></section>', a)
          tech=s[a:b]
          tech=re.sub(r'<a class="tech" href="[^"]+">', '<div class="tech">', tech)
          tech=tech.replace('</a>', '</div>')
          s=s[:a]+tech+s[b:]

          # Services: only first three cards opened service pages; last three were request buttons.
          s=s.replace('href="/op-project-staging/revision/" style="background-image:url(\'/op-project-staging/assets/images/home-service-revision.webp\')"',
                      'href="/op-project-staging/contacts/" style="background-image:url(\'/op-project-staging/assets/images/home-service-revision.webp\')"')
          s=s.replace('href="/op-project-staging/supply/" style="background-image:url(\'/op-project-staging/assets/images/home-service-supply.webp\')"',
                      'href="/op-project-staging/contacts/" style="background-image:url(\'/op-project-staging/assets/images/home-service-supply.webp\')"')
          s=s.replace('href="/op-project-staging/installation/" style="background-image:url(\'/op-project-staging/assets/images/home-service-installation.webp\')"',
                      'href="/op-project-staging/contacts/" style="background-image:url(\'/op-project-staging/assets/images/home-service-installation.webp\')"')

          # Exact team portraits, original right-side image and request image.
          s=s.replace('.avatars span{width:28px;height:28px;border-radius:50%;display:inline-block;border:2px solid #fff;margin-right:-6px;background:#bbb}',
                      '.avatars img{width:28px;height:28px;border-radius:50%;display:inline-block;border:2px solid #fff;margin-right:-6px;object-fit:cover}')
          s=s.replace('<span></span><span></span>',
                      '<img src="/op-project-staging/assets/images/home-avatar-anton.jpg" alt="Антон Овсянко"><img src="/op-project-staging/assets/images/home-avatar-sergey.jpg" alt="Сергей Печников">')
          s=re.sub(r'(<div class="brand"><img src=")[^"]+("[^>]*>)',
                   r'\1/op-project-staging/assets/images/home-intro-brand.png\2', s, count=1)
          s=s.replace("background:url('/op-project-staging/assets/images/bbf23ae3c0e3.webp') center/cover",
                      "background:url('/op-project-staging/assets/images/home-request.jpg') center/cover")

          # Footer routes copied from the original site. Restrict replacements to footer only.
          if '<footer' in s:
              pre, foot=s.split('<footer',1)
              footer='<footer'+foot
              route_by_text={
                  'О нас':'/op-project-staging/home/',
                  'Контакты':'/op-project-staging/contacts/',
                  'Референс-лист':'/op-project-staging/referencelist/',
                  'Оборудование б/у':'/op-project-staging/offers/',
                  'Проектирование':'/op-project-staging/tech-project/',
                  'Оптимизация':'/op-project-staging/optimisation/',
                  'Аудит проекта':'/op-project-staging/tech-audit/',
                  'Ревизия':'/op-project-staging/revision/',
                  'Комплектация':'/op-project-staging/plant/',
                  'Сушка':'/op-project-staging/drying/',
                  'Измельчение':'/op-project-staging/plant/',
                  'Сжигание':'/op-project-staging/plant/',
                  'Брикетирование':'/op-project-staging/pellets/',
                  'Гранулирование':'/op-project-staging/pellets/',
                  'Утилизация тепла':'/op-project-staging/optimisation/',
                  'Углежжение':'/op-project-staging/charcoal/',
                  'Поддоны из опилок':'/op-project-staging/presswood/',
                  'Композитные материалы':'/op-project-staging/composite/',
                  'Деревообработка':'/op-project-staging/page-derevo/',
                  'Агропром':'/op-project-staging/agro/',
                  'Птицеводство':'/op-project-staging/poultry/'
              }
              for text, href in route_by_text.items():
                  footer=re.sub(r'<a href="[^"]*">'+re.escape(text)+r'</a>', f'<a href="{href}">{text}</a>', footer)
              # Exact source used e-mail for these three entries.
              footer=re.sub(r'<a href="[^"]*">Монтаж</a>', '<a href="mailto:anton.ovsyanko@gmail.com">Монтаж</a>', footer)
              footer=re.sub(r'<a href="[^"]*">Пищевая промышленность</a>', '<a href="mailto:anton.ovsyanko@gmail.com">Пищевая промышленность</a>', footer)
              footer=re.sub(r'<a href="[^"]*">Энергетика</a>', '<a href="mailto:anton.ovsyanko@gmail.com">Энергетика</a>', footer)
              s=pre+footer

          p.write_text(s,encoding='utf-8')

      - name: Verify restored details
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'home-avatar-anton.jpg' index.html
          grep -q 'home-avatar-sergey.jpg' index.html
          grep -q 'home-intro-brand.png' index.html
          grep -q 'home-request.jpg' index.html
          grep -q '/op-project-staging/callmeback/'>/dev/null < <(grep -o '/op-project-staging/callmeback/' index.html)
          ! grep -q '<a class="tech"' index.html

      - name: Commit exact restoration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-home-details.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore exact original home details and links'
          git push origin HEAD:main
