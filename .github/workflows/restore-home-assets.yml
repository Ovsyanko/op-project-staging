name: Finalize exact home restoration

on:
  push:
    branches: [restore-home-exact-copy]
    paths:
      - '.github/workflows/restore-home-assets.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-home-exact-copy
          fetch-depth: 0

      - name: Download exact original composite image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://s3.reg.solutions/6dae29aa-f330-44ff-8818-1ab5a026f618/images/60e473cb-7f17-49d3-a324-6e377e1c4087-sample_pic.png' -o assets/images/home-composite-original.png
          echo '850d6c848967cde36e13be5225c3e6e21564b6ef4be105dbfe322b98e3025639  assets/images/home-composite-original.png' | sha256sum -c -

      - name: Point home to exact composite and clean temporary files
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/op-project-staging/assets/images/home-composite-original.jpg', '/op-project-staging/assets/images/home-composite-original.png')
          s = s.replace('/op-project-staging/assets/images/81c1da3ac8f2.jpg', '/op-project-staging/assets/images/home-composite-original.png')
          p.write_text(s, encoding='utf-8')
          for f in [
              Path('assets/images/home-composite-original.jpg'),
              Path('assets/images/home-service-project-note.txt'),
              Path('assets/images/home-service-project.webp.b64'),
              Path('RESTORE_HOME_README.md'),
          ]:
              if f.exists(): f.unlink()

      - name: Verify home uses only exact restored image paths
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'home-composite-original.png' index.html
          for f in project optimisation audit revision supply installation; do
            grep -q "home-service-${f}.webp" index.html
            test -s "assets/images/home-service-${f}.webp"
          done
          ! grep -q '81c1da3ac8f2.jpg' index.html

      - name: Commit final exact restoration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-home-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize exact original images on home page'
          git push origin HEAD:restore-home-exact-copy
