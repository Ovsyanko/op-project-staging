name: Restore REG.RU baseline

on:
  push:
    paths:
      - ".github/workflows/restore-reg-baseline.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch production archive branch
        run: git fetch origin reg-ru-current:refs/remotes/origin/reg-ru-current

      - name: Restore production snapshot into clean staging tree
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          git show origin/reg-ru-current:"backup 21.10.2026.zip" > "$TMP/site.zip"
          python3 - "$TMP/site.zip" "$TMP/unpacked" <<'PY'
          import os, sys, zipfile
          zpath, out = sys.argv[1], sys.argv[2]
          os.makedirs(out, exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              z.extractall(out)
          candidates=[]
          for root, dirs, files in os.walk(out):
              if "index.html" in files:
                  candidates.append(root)
          if not candidates:
              raise SystemExit("No index.html found in archive")
          candidates.sort(key=lambda p:(p.count(os.sep), len(p)))
          root=candidates[0]
          print("ARCHIVE_SITE_ROOT="+root)
          with open("/tmp/site_root","w",encoding="utf-8") as f:
              f.write(root)
          PY

          SITE_ROOT="$(cat /tmp/site_root)"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name tools -exec rm -rf {} +
          cp -a "$SITE_ROOT"/. .

          python3 - <<'PY'
          from pathlib import Path
          import re
          text_ext={".html",".htm",".css",".js",".json",".xml",".txt",".php"}
          for p in Path(".").rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              if any(part in {".git",".github"} for part in p.parts):
                  continue
              try:
                  s=p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              old=s
              s=re.sub(r'(["\'])/(?!/|op-project-staging/)', r'\1/op-project-staging/', s)
              s=re.sub(r'url\(/(?!/|op-project-staging/)', 'url(/op-project-staging/', s)
              if p.as_posix()=="assets/site-shell.js":
                  s=s.replace("const B=''", "const B='/op-project-staging'").replace('const B=""', 'const B="/op-project-staging"')
              if p.suffix.lower() in {".html",".htm"}:
                  if re.search(r'<meta\s+name=["\']robots["\']', s, flags=re.I):
                      s=re.sub(r'<meta\s+name=["\']robots["\'][^>]*>', '<meta name="robots" content="noindex,nofollow,noarchive">', s, flags=re.I)
                  elif "<head" in s.lower():
                      s=re.sub(r'(<head[^>]*>)', r'\1<meta name="robots" content="noindex,nofollow,noarchive">', s, count=1, flags=re.I)
              if s!=old:
                  p.write_text(s,encoding="utf-8")
          PY

          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore exact REG.RU production baseline for staging"
          git push --force origin HEAD:refs/heads/reg-baseline-unpacked

      - name: Summary
        run: |
          echo "Baseline branch: reg-baseline-unpacked"
          echo "Source: backup 21.10.2026.zip from reg-ru-current"
