umns:1fr}.agro h1{font-size:34px}.herotxt{left:24px;right:24px}}</style></head><body><div id="app"></div><script src="/op-project-staging/assets/site-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const m=document.querySelector('main');if(!m)return;m.outerHTML=`<main class="agro"><div class="narrow"><h1>Решения для переработчиков сельхозпродукции</h1><div class="subtitle">экономия - эффективность - отдача</div></div><section class="hero"><img src="/op-project-staging/assets/images/3ead5d54128f.webp" alt="Элеваторы и переработка сельхозпродукции"><div class="herotxt"><h2>Элеваторы - Комбикормовые<br>производства - сахарные заводы</h2><div>Сушка, переработка отходов, производство топлива,<br>гранулирование, автоматизация</div></div></section><section class="narrow examples"><h2>Примеры решений</h2><div class="cards"><article class="card"><img src="/op-project-staging/assets/images/077745c26e03.jpg"><h3>Сушка сыпучих продуктов</h3><p>Зерно, солома, трава, жом</p><a href="/op-project-staging/drying/">Запрос</a></article><article class="card"><img src="/op-project-staging/assets/images/2d103a90c319.jpg"><h3>Утилизация отходов</h3><p>Теплогенераторы на зерноотходах, пеллеты из соломы</p><a href="/op-project-staging/combustion/">Запрос</a></article><article class="card"><img src="/op-project-staging/assets/images/fba6ff4c862b.webp"><h3>Производство гранулированных кормов</h3><p>Производство травяных гранул, гранулирование комбикорма</p><a href="/op-project-staging/pellets/">Запрос</a></article></div><div class="text">Мы решаем задачи, связанные с обработкой и переработкой различных видов биомассы. Таких как зерно, солома, трава, лузга, шелуха, жом и т.д. Наша задача - на основе анализа материального и энергетического баланса предприятия предложить оптимальное решение, которое позволит заказчику получить наилучший экономический эффект при наименьших затратах:\n\n- увеличение полезного выхода продукции на единицу перерабатываемого сырья,\n- повышение производительности имеющейся технологии,\n- выпуск новых видов продукции, пользующихся спросом,\n- снижение затрат на энергоносители,\n- снижение себестоимости продукции,\n- снижение затрат на утилизацию отходов</div><section class="request"><img src="/op-project-staging/assets/images/7d3b780420e9.webp"><div class="rf"><h2>Сделать запрос</h2><p>Оставьте заявку, и мы свяжемся с Вами для уточнения деталей задачи, требующей решения</p><form onsubmit="return false"><input placeholder="Имя"><input placeholder="+7"><input placeholder="E-mail"><textarea placeholder="Опишите задачу"></textarea><label><input type="checkbox"> Согласен получать новости и полезные рассылки</label><label><input type="checkbox"> Согласен на обработку персональных данных</label><button>Отправить</button></form></div></section></section></main>`})</script></body></html>
