я внутренний рынок биотоплива. Частные и промышленные потребители устанавливают специализированные котлы на пеллетах (в том числе отечественные). Брикеты присутствуют в ассортименте всех розничных сетей, как практичная и качественная замена дров.<br><br>Популярность современного экологически чистого топлива растет.<br><br>Гранулирование и брикетирование опилок остается надежным решением для утилизации больших объемов отходов лесопиления и деревообработки.</section><section class="tech"><h2>Технология</h2><div class="tech-sub">Последовательность этапов</div><div class="steps"><div class="step">Первичное измельчение сырья <span>⌄</span></div><div class="step">Сушка <span>⌄</span></div><div class="step">Доизмельчение сухого сырья <span>⌄</span></div><div class="step">Гранулирование, охлаждение, просеивание гранул <span>⌄</span></div><div class="step">Брикетирование <span>⌄</span></div><div class="step">Фасовка <span>⌄</span></div></div></section><section class="drawing"><div class="drawing-inner"><button class="darr dprev">‹</button><img id="pdrawing" src="/op-project-staging/assets/images/2d103a90c319.jpg" alt="Чертеж линии"><button class="darr dnext">›</button></div><div class="ddots" id="pdots">● ○</div></section><section class="request"><img src="/op-project-staging/assets/images/7d3b780420e9.webp"><div class="rf"><h2>Сделать запрос</h2><p>Оставьте заявку, и мы свяжемся с Вами для уточнения деталей задачи, требующей решения</p><form onsubmit="return false"><input placeholder="Имя*"><input placeholder="+7*"><input placeholder="E-mail*"><textarea placeholder="Опишите задачу*"></textarea><label><input type="checkbox"> Согласен получать новости и полезные рассылки</label><label><input type="checkbox"> Согласен на обработку персональных данных</label><button>Отправить</button></form></div></section></main>`;const imgs=['/op-project-staging/assets/images/2d103a90c319.jpg','/op-project-staging/assets/images/a537c846bb4f.jpg'];let i=0,im=document.getElementById('pdrawing')
