<div id="app"></div><script src="/op-project-staging/assets/site-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const m=document.querySelector('main');if(!m)return;const ext=['/op-project-staging/assets/originals/64449c5b-282d-48cf-9889-6afe2c037ce0-pallets1.jpg','/op-project-staging/assets/images/home-slide-presswood.webp','/op-project-staging/assets/originals/4209a92e-3d71-47dd-a61b-affcc1716b39-pallets100.jpg','/op-project-staging/assets/originals/7bfe37a3-bbd5-4c71-accf-a35f7107e1cd-palletscustom.jpg'];m.outerHTML=`<main class="pw"><section class="wrap2"><h1>Поддоны из опилок</h1></section><section class="mosaic"><div class="mosaic-track">${[...ext,...ext].map(x=>`<div class="tile" style="background-image:url('${x}')"></div>`).join('')}</div></section><section class="wrap2"><h2 class="metrics-title">Преимущества</h2><div class="metrics"><div><div class="bubble">2,2 т.</div><b>грузоподъемность</b></div><div><div class="bubble">1200</div><b>пустых поддонов в одном контейнере</b></div><div><div class="bubble">4-5<br>долл.</div><b>себестоимость производства одного поддона</b></div><div><div class="bubble">{ }</div><b>стандартные и кастомные размеры</b></div></div><div class="desc"><p>Транспортные поддоны <strong>по технологии Presswood</strong> изготавливаются из древесных опилок путем прессования. В качестве связующего используются водостойкие смолы.</p><p>* Прессованные поддоны имеют стандартные размеры и пригодны для хранения и транспортировки грузов наравне с обычными паллетами, в т.ч. с использованием вилочных погрузчиков<br>* Себестоимость прессованного поддона значительно ниже себестоимости деревянного поддона такого же размера.<br>* Прессованные поддоны вкладываются один в другой и таким образом экономят место. В контейнер 40-фут помещается до 1 200 штук.<br>* При использовании прессованных поддонов в международных перевозках не требуется фумигация и выпуск фитосанитарных сертификатов.<br>* Оценка емкости рынка поддонов в России 66-67 млн. штук в год.<br>* Производство прессованных поддонов позволяет эффективно утилизировать отходы лесопиления<br>* Производительность одного пресса 13 поддонов в час. 250-300 поддонов в сутки. до 105 тыс. поддонов в год.<br>* В составе одной линии до 3 прессов. До 300 тыс. поддонов в год</p></div></section><div class="widepic"></div><section class="tech"><h2>Технология</h2><div class="sub">Последовательность этапов</div><div class="acc"><div class="item open"><div class="head"><span>Подготовка древесного сырья</span><span class="chev">⌃</span></div><div class="body">Древесное сырье для производства прессованных поддонов должно быть сухим и иметь однородный фракционный состав. Участок подготовки и сушки сырья комплектуется соответствующим измельчительным и сушильным оборудованием.</div></div><div class="item"><div class="head"><span>Подготовка формовочной массы</span><span class="chev">⌃</span></div><div class="body">Подготовленное сырье смешивается со связующей смолой с помощью специализированного смесительного оборудования.</div></div><div class="item"><div class="head"><span>Прессование</span><span class="chev">⌃</span></div><div class="body">Подготовленное сырье со смолой подается в пресс, где происходит формирование поддона.<br><br>После затвердевания готовые поддоны направляются на склад готовой продукции.</div></div></div></section></main>`;document.querySelectorAll('.item .head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));})</script><script src="/op-project-staging/assets/contact-form.js" defer></script></body></html>
