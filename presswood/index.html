uterHTML=`<main class="direct"><section class="hero"><div class="copy"><h1>Поддоны из опилок</h1><p>Прессованные транспортные поддоны из древесных отходов по технологии Presswood.</p></div><div class="photo" style="background-image:url('${imgs[0]}')"></div></section><section class="metrics"><div><b>2,2 т</b><span>грузоподъемность</span></div><div><b>1200</b><span>пустых поддонов в 40-футовом контейнере</span></div><div><b>4–5 долл.</b><span>ориентировочная себестоимость</span></div></section><div class="gallery">${imgs.map(x=>`<img src="${x}" loading="lazy">`).join('')}</div><section class="box"><p>Транспортные поддоны по технологии Presswood изготавливаются из древесных опилок путем прессования. В качестве связующего используются водостойкие смолы.</p><ul><li>Стандартные и кастомные размеры.</li><li>Подходят для хранения и транспортировки грузов, в том числе с использованием вилочных погрузчиков.</li><li>Себестоимость ниже деревянного поддона сопоставимого размера.</li><li>Поддоны вкладываются один в другой и экономят место.</li><li>Для международных перевозок не требуется фумигация и выпуск фитосанитарных сертификатов.</li><li>Оценка емкости рынка поддонов в России — 66–67 млн штук в год.</li><li>Производительность одного пресса — 13 поддонов в час, 250–300 в сутки, до 105 тыс. в год.</li><li>Линия из трех прессов — до 300 тыс. поддонов в год.</li></ul><h2>Технология</h2><ol><li>Подготовка древесного сырья</li><li>Подготовка формовочной массы</li><li>Прессование</li></ol></section><section class="cta"><h2>Сделать запрос</h2><a href="/op-project-staging/contacts/">Сделать запрос</a></section></main>`})</script></body></html>
