<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Поддоны из опилок — ОП Проект</title><link rel="stylesheet" href="/op-project-staging/assets/site-shell.css"><style>.pw{padding:30px 0 0}.wrap2{max-width:900px;margin:auto;padding:0 28px}.pw h1{text-align:center;font-size:42px;font-weight:500;margin:0 0 36px}.mosaic{width:100%;overflow:hidden;margin-bottom:55px}.mosaic-track{display:flex;gap:12px;width:max-content;transform:translateX(-160px)}.tile{width:285px;height:360px;border-radius:22px;background:#eee center/cover no-repeat}.metrics-title{text-align:center;font-size:40px;margin:0 0 40px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;text-align:center;margin-bottom:52px}.bubble{width:82px;height:82px;border-radius:50%;background:#406cff;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:22px;font-weight:500}.metrics b{font-size:17px;line-height:1.25}.desc{font-size:16px;line-height:1.55;margin-bottom:34px}.widepic{width:100%;height:420px;background:url('/op-project-staging/assets/images/home-slide-presswood.webp') center/cover no-repeat;margin:0 0 42px}.tech{max-width:900px;margin:auto;padding:0 28px 70px}.tech h2{text-align:center;font-size:38px;margin:0 0 8px}.tech .sub{text-align:center;margin-bottom:28px}.acc{border-top:1px solid #ddd}.item{border-bottom:1px solid #ddd}.head{display:flex;justify-content:space-between;gap:20px;padding:24px 0;cursor:pointer;font-size:20px;font-weight:500}.body{display:none;padding:0 0 24px;font-size:16px;line-height:1.55}.item.open .body{display:block}.chev{transition:.2s}.item.open .chev{transform:rotate(180deg)}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.widepic{height:300px}.tile{width:220px;height:290px}}</style></head><body><div id="app"></div><script src="/op-project-staging/assets/site-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const m=document.querySelector('main');if(!m)return;const ext=['https://s3.reg.solutions/6dae29aa-f330-44ff-8818-1ab5a026f618/images/64449c5b-282d-48cf-9889-6afe2c037ce0-pallets1.jpg','https://s3.reg.solutions/6dae29aa-f330-44ff-8818-1ab5a026f618/images/816f3dc8-7e38-4fa2-a6ab-aa195825085d-_ergo8phfc.webp','https://s3.reg.solutions/6dae29aa-f330-44ff-8818-1ab5a026f618/images/4209a92e-3d71-47dd-a61b-affcc1716b39-pallets100.jpg','https://s3.reg.solutions/6dae29aa-f330-44ff-8818-1ab5a026f618/images/7bfe37a3-bbd5-4c71-accf-a35f7107e1cd-palletscustom.jpg'];m.outerHTML=`<main class="pw"><section class="wrap2"><h1>Поддоны из опилок</h1></section><section class="mosaic"><div class="mosaic-track">${[...ext,...ext].map(x=>`<div class="tile" style="background-image:url('${x}')"></div>`).join('')}</div></section><section class="wrap2"><h2 class="metrics-title">Преимущества</h2><div class="metrics"><div><div class="bubble">2,2 т.</div><b>грузоподъемность</b></div><div><div class="bubble">1200</div><b>пустых поддонов в одном контейнере</b></div><div><div class="bubble">4-5<br>долл.</div><b>себестоимость производства одного поддона</b></div><div><div class="bubble">{ }</div><b>стандартные и кастомные размеры</b></div></div><div class="desc"><p>Транспортные поддоны <strong>по технологии Presswood</strong> изготавливаются из древесных опилок путем прессования. В качестве связующего используются водостойкие смолы.</p><p>* Прессованные поддоны имеют стандартные размеры и пригодны для хранения и транспортировки грузов наравне с обычными паллетами, в т.ч. с использованием вилочных погрузчиков<br>* Себестоимость прессованного поддона значительно ниже себестоимости деревянного поддона такого же размера.<br>* Прессованные поддоны вкладываются один в другой и таким образом экономят место. В контейнер 40-фут помещается до 1 200 штук.<br>* При использовании прессованных поддонов в международных перевозках не требуется фумигация и выпуск фитосанитарных сертификатов.<br>* Оценка емкости рынка поддонов в России 66-67 млн. штук в год.<br>* Производство прессованных поддонов позволяет эффективно утилизировать отходы лесопиления<br>* Производительность одного пресса 13 поддонов в час. 250-300 поддонов в сутки. до 105 тыс. поддонов в год.<br>* В составе одной линии до 3 прессов. До 300 тыс. поддонов в год</p></div></section><div class="widepic"></div><section class="tech"><h2>Технология</h2><div class="sub">Последовательность этапов</div><div class="acc"><div class="item open"><div class="head"><span>Подготовка древесного сырья</span><span class="chev">⌃</span></div><div class="body">Древесное сырье для производства прессованных поддонов должно быть сухим и иметь однородный фракционный состав. Участок подготовки и сушки сырья комплектуется соответствующим измельчительным и сушильным оборудованием.</div></div><div class="item"><div class="head"><span>Подготовка формовочной массы</span><span class="chev">⌃</span></div><div class="body">Подготовленное сырье смешивается со связующей смолой с помощью специализированного смесительного оборудования.</div></div><div class="item"><div class="head"><span>Прессование</span><span class="chev">⌃</span></div><div class="body">Подготовленное сырье со смолой подается в пресс, где происходит формирование поддона.<br><br>После затвердевания готовые поддоны направляются на склад готовой продукции.</div></div></div></section></main>`;document.querySelectorAll('.item .head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));})</script></body></html>
