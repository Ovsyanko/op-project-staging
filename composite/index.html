<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Композитные материалы — ОП Проект</title><link rel="stylesheet" href="/op-project-staging/assets/site-shell.css"><style>.comp{padding:30px 0 0}.wrap2{max-width:900px;margin:auto;padding:0 28px}.mosaic{height:250px;margin-bottom:46px;position:relative;background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden}.mosaic .title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:28px;font-weight:500;text-shadow:0 1px 5px #333;pointer-events:none}.mosaic .cta{position:absolute;left:50%;top:64%;transform:translateX(-50%);background:rgba(90,90,90,.55);color:#fff;border-radius:8px;padding:10px 18px}.intro h1{text-align:center;font-size:40px;font-weight:500;margin:0 0 32px}.intro p{font-size:16px;line-height:1.55}.series-title{text-align:center;font-size:38px;margin:58px 0 5px}.series-sub{text-align:center;margin-bottom:40px}.series{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;text-align:center;margin-bottom:58px}.bubble{width:76px;height:76px;border-radius:50%;background:#406cff;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:22px}.series b{display:block;font-size:18px;line-height:1.3}.lower{position:relative;width:100%;height:520px;overflow:hidden;background:#eee}.lower img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}.thumbs{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;z-index:2}.thumb{width:58px;height:38px;border-radius:8px;border:2px solid rgba(255,255,255,.65);background-size:cover;background-position:center;cursor:pointer;opacity:.75}.thumb.active{border-color:#fff;opacity:1}.arr{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:rgba(70,70,70,.45);color:#fff;font-size:26px;cursor:pointer;z-index:2}.prev{left:16px}.next{right:16px}@media(max-width:760px){.mosaic{height:220px}.series{grid-template-columns:1fr 1fr}.lower{height:360px}.intro h1{font-size:34px}}</style></head><body><div id="app"></div><script src="/op-project-staging/assets/site-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const m=document.querySelector('main');if(!m)return;m.outerHTML=`<main class="comp"><section class="wrap2"><div class="mosaic" style="background-image:url('/op-project-staging/assets/images/home-composite-original.png')"><div class="title">Композитные материалы на основе<br>древесных отходов</div><a class="cta" href="/op-project-staging/contacts/">Запрос</a></div><section class="intro"><h1>Композитные материалы на основе щепы и опилок</h1><p>ОП Проект осуществляет разработку инновационного композитного материала на основе древесных отходов (щепы/опилок) и других видов биомассы (солома/тростник/шелуха риса/гречки) и минеральных связующих.</p><p>В линейке будущих материалов планируются:<br>1. Теплоизоляционная плита<br>2. Конструкционно-изоляционная плита<br>3. Конструкционная плита/блок<br>4. Огнезащитная плита<br>5. Изделия для шумозащиты<br>6. Декоративные светопрозрачные элементы</p></section><h2 class="series-title">4 серии строительных плит</h2><div class="series-sub">закрывают разные функции</div><div class="series"><div><div class="bubble">L</div><b>300-450 кг/м3<br>Теплоизоляционные плиты</b></div><div><div class="bubble">M</div><b>450-650 кг/м3<br>Конструкционно-теплоизоляционные плиты</b></div><div><div class="bubble">S</div><b>650-900 кг/м3<br>Конструкционные плиты</b></div><div><div class="bubble">X</div><b>900-1000 кг/м3<br>Специальные изделия<br>(огнезащита, шумозащита, декор)</b></div></div></section><section class="lower"><button class="arr prev">‹</button><img id="compimg" alt="Образцы Вихролита"><button class="arr next">›</button><div class="thumbs" id="thumbs"></div></section></main>`;const imgs=['/op-project-staging/assets/images/vihrolyt-samples.png','/op-project-staging/assets/images/vihrolyt-wa0003.jpg','/op-project-staging/assets/images/vihrolyt-wa0004.jpg'];let i=0,im=document.getElementById('compimg'),ths=document.getElementById('thumbs');function show(){im.src=imgs[i];ths.innerHTML=imgs.map((x,n)=>`<button class="thumb ${n===i?'active':''}" aria-label="Фото ${n+1}" data-i="${n}" style="background-image:url('${x}')"></button>`).join('');ths.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{i=+b.dataset.i;show()})}show();document.querySelector('.prev').onclick=()=>{i=(i+imgs.length-1)%imgs.length;show()};document.querySelector('.next').onclick=()=>{i=(i+1)%imgs.length;show()};})</script></body></html>
